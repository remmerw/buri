name: ktlint-format

on:
  push:
    branches: [format/kotlin-style]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/0.48.2/ktlint
          chmod a+x ktlint

      - name: Run ktlint format
        run: |
          # Run ktlint format on all Kotlin files. The command may exit non-zero if issues are found; allow the step to continue.
          ./ktlint -F "**/*.kt" "**/*.kts" || true

      - name: Commit formatted files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "style: format Kotlin files with ktlint"
            git push origin HEAD:format/kotlin-style
          else
            echo "No formatting changes"
          fi
